[project]
name = "parking-assistant"
version = "0.4.0"
description = "RAG chatbot for a parking garage: information, reservations, guard rails, evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-milvus>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "pymilvus[milvus_lite]>=2.5",
    "fastembed>=0.5",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    # preshed 3.0.14 makes spaCy fail to load models (OverflowError in the tokenizer).
    "preshed<3.0.14",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
parking-assistant = "parking_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/parking_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
